plugins {
    id 'com.android.application'
}

android {
    namespace 'sk.peto.cinema'
    compileSdk 34

    defaultConfig {
        applicationId 'sk.peto.cinema'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'cinema123'
            keyAlias 'cinema'
            keyPassword 'cinema123'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
